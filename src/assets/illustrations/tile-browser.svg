<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-label="Finestra del browser"><style>
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
.pulse.d1{animation-delay:-.8s}.pulse.d2{animation-delay:-1.6s}.pulse.d3{animation-delay:-2.4s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.6);opacity:.45}}
.flow{stroke-dasharray:5 11;animation:flow 2.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.scan{animation:scan 4.5s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(640px)}}
.play{animation:play 7s linear infinite}
@keyframes play{from{transform:translateX(0)}to{transform:translateX(560px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121317"/><stop offset="1" stop-color="#1b1d23"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#D7E2EA" fill-opacity=".14"/></pattern></defs><rect width="420" height="270" fill="url(#g)"/><rect width="420" height="270" fill="url(#dots)"/><rect x="70" y="52" width="280" height="166" rx="16" fill="#121317" fill-opacity=".6" stroke="#D7E2EA" stroke-width="4"/><line x1="70" y1="86" x2="350" y2="86" stroke="#D7E2EA" stroke-width="4"/><circle cx="94" cy="69" r="6" fill="#E50914"/><circle cx="114" cy="69" r="6" fill="#D7E2EA"/><circle cx="134" cy="69" r="6" fill="#D7E2EA" fill-opacity=".5"/><rect x="92" y="106" width="120" height="14" rx="7" fill="#D7E2EA"/><rect x="92" y="130" width="88" height="10" rx="5" fill="#D7E2EA" fill-opacity=".5"/><rect x="92" y="156" width="70" height="30" rx="15" fill="#E50914"/><rect x="232" y="106" width="96" height="80" rx="12" fill="#E50914" fill-opacity=".85"/><path d="M300 150L338 224L318 216L308 238Z" fill="#D7E2EA" stroke="#121317" stroke-width="3" stroke-linejoin="round"/></svg>