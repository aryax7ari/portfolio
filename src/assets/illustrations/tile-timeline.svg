<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-label="Timeline di montaggio video"><style>
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
.pulse.d1{animation-delay:-.8s}.pulse.d2{animation-delay:-1.6s}.pulse.d3{animation-delay:-2.4s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.6);opacity:.45}}
.flow{stroke-dasharray:5 11;animation:flow 2.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.scan{animation:scan 4.5s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(640px)}}
.play{animation:play 7s linear infinite}
@keyframes play{from{transform:translateX(0)}to{transform:translateX(560px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D7E2EA"/><stop offset="1" stop-color="#f4f8fb"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#E50914" fill-opacity=".14"/></pattern></defs><rect width="420" height="270" fill="url(#g)"/><rect width="420" height="270" fill="url(#dots)"/><rect x="50" y="70" width="320" height="120" rx="14" fill="#D7E2EA" fill-opacity=".55"/><rect x="62" y="84" width="90" height="26" rx="6" fill="#E50914" fill-opacity=".9"/><rect x="160" y="84" width="60" height="26" rx="6" fill="#0C0C0C" fill-opacity=".9"/><rect x="226" y="84" width="120" height="26" rx="6" fill="#E50914" fill-opacity=".9"/><rect x="62" y="122" width="60" height="26" rx="6" fill="#E50914" fill-opacity=".9"/><rect x="128" y="122" width="130" height="26" rx="6" fill="#0C0C0C" fill-opacity=".9"/><rect x="264" y="122" width="90" height="26" rx="6" fill="#E50914" fill-opacity=".9"/><rect x="62" y="160" width="110" height="26" rx="6" fill="#E50914" fill-opacity=".9"/><rect x="178" y="160" width="70" height="26" rx="6" fill="#0C0C0C" fill-opacity=".9"/><rect x="254" y="160" width="100" height="26" rx="6" fill="#E50914" fill-opacity=".9"/><rect x="208" y="60" width="4" height="150" fill="#0C0C0C"/><path d="M200 54H220L210 70Z" fill="#0C0C0C"/></svg>