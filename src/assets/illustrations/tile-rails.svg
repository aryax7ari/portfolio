<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-label="Binari e segnale ferroviario"><style>
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
.pulse.d1{animation-delay:-.8s}.pulse.d2{animation-delay:-1.6s}.pulse.d3{animation-delay:-2.4s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.6);opacity:.45}}
.flow{stroke-dasharray:5 11;animation:flow 2.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.scan{animation:scan 4.5s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(640px)}}
.play{animation:play 7s linear infinite}
@keyframes play{from{transform:translateX(0)}to{transform:translateX(560px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E50914"/><stop offset="1" stop-color="#ff4a53"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".14"/></pattern></defs><rect width="420" height="270" fill="url(#g)"/><rect width="420" height="270" fill="url(#dots)"/><rect x="0" y="92" width="420" height="178" fill="#E50914" fill-opacity=".18"/><line x1="0" y1="92" x2="420" y2="92" stroke="#fff" stroke-opacity=".5" stroke-width="3"/><line x1="204" y1="92" x2="40" y2="270" stroke="#fff" stroke-width="7"/><line x1="216" y1="92" x2="380" y2="270" stroke="#fff" stroke-width="7"/><line x1="200" y1="100" x2="220" y2="100" stroke="#0C0C0C" stroke-width="2.3" stroke-opacity=".85"/><line x1="187" y1="116" x2="233" y2="116" stroke="#0C0C0C" stroke-width="2.9" stroke-opacity=".85"/><line x1="170" y1="138" x2="250" y2="138" stroke="#0C0C0C" stroke-width="3.8" stroke-opacity=".85"/><line x1="149" y1="165" x2="271" y2="165" stroke="#0C0C0C" stroke-width="4.9" stroke-opacity=".85"/><line x1="124" y1="196" x2="296" y2="196" stroke="#0C0C0C" stroke-width="6.1" stroke-opacity=".85"/><line x1="97" y1="231" x2="323" y2="231" stroke="#0C0C0C" stroke-width="7.5" stroke-opacity=".85"/><rect x="300" y="26" width="10" height="110" rx="4" fill="#fff"/><rect x="286" y="26" width="38" height="52" rx="10" fill="#E50914" stroke="#fff" stroke-width="4"/><circle cx="305" cy="42" r="8" fill="#0C0C0C"/><circle cx="305" cy="62" r="8" fill="#fff" fill-opacity=".35"/></svg>